# deploy.yml — Build Hugo site and deploy to GitHub Pages on every push to main.
#
# Prerequisites (one-time setup in your GitHub repo):
#   1. Go to Settings > Pages
#   2. Under "Source", select "GitHub Actions"
#   3. Save — that's it. This workflow does everything else automatically.

name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:   # Allows manual trigger from GitHub Actions tab

# Grant the workflow permission to write to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Only allow one deployment at a time
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      HUGO_VERSION: 0.160.1
      # SHA256 of hugo_extended_<HUGO_VERSION>_linux-amd64.tar.gz, taken from the
      # release's published checksums file. Bump this together with HUGO_VERSION:
      #   curl -sL https://github.com/gohugoio/hugo/releases/download/v<ver>/hugo_<ver>_checksums.txt
      HUGO_SHA256: 133adf4932c1b626b6fe6aa28d56791555abe3ceff167e03be534e8324c9ed39
    steps:
      # Actions are pinned to commit SHAs, not tags. A tag can be repointed at
      # different code, and this job holds pages:write - so a moved tag would be
      # able to publish to the live site. The trailing comment records the tag.
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          fetch-depth: 0   # Full history for Hugo's .GitInfo and lastmod
          persist-credentials: false   # don't leave the token in .git/config

      - name: Install Hugo Extended
        run: |
          set -euo pipefail
          TARBALL="hugo_extended_${HUGO_VERSION}_linux-amd64.tar.gz"
          wget -q "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/${TARBALL}"
          # Fail the build if the downloaded binary is not byte-for-byte expected.
          echo "${HUGO_SHA256}  ${TARBALL}" | sha256sum -c -
          tar -xzf "${TARBALL}"
          sudo mv hugo /usr/local/bin/
          hugo version

      - name: Configure GitHub Pages
        id: pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b  # v5

      - name: Build site
        run: hugo --minify
        # --minify shrinks HTML/CSS/JS for faster page loads
        #
        # baseURL deliberately comes from config.toml (https://biomimicry-hub.com/)
        # rather than from steps.pages.outputs.base_url. Before the custom domain
        # was configured in repo settings that output resolved to the project path
        # (conwayr1.github.io/biomimicry-hub), which baked a "/biomimicry-hub/"
        # prefix into every URL. Google indexed 27 of those and they now 404.
        # Keeping config.toml as the single source of truth stops that recurring.

      - name: Upload artifact
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa  # v3
        with:
          path: ./public

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e  # v4
