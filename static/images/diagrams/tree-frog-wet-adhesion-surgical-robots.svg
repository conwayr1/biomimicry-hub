f" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><line x1="460" y1="188" x2="468" y2="188" fill="none" stroke="#2d6a4f" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
<text x="338" y="240.0" text-anchor="start" style="font-size:12.0px;font-weight:400;fill:#5b5b5b;">
<tspan x="338" dy="0.0">Structured soft surfaces with</tspan>
<tspan x="338" dy="15.6">drainage channels maintain a</tspan>
<tspan x="338" dy="15.6">thin</tspan>
</text>
<text x="618" y="120" class="step"><tspan class="num">03</tspan><tspan dx="8" class="word">APPLICATION</tspan></text>
<text x="618" y="145.0" text-anchor="start" style="font-size:13.0px;font-weight:600;fill:#1a1a1a;">
<tspan x="618" dy="0.0">Wet-condition adhesive pads</tspan>
<tspan x="618" dy="16.9">for surgical robots,</tspan>
<tspan x="618" dy="16.9">micro-manipulation of</tspan>
<tspan x="618" dy="16.9">delicate wet objects in</tspan>
<tspan x="618" dy="16.9">manufacturing</tspan>
</text>
<text x="618" y="271.0" text-anchor="start" style="font-size:11.0px;font-weight:400;fill:#8a8a8a;">
<tspan x="618" dy="0.0">Real-world: Tree frog-inspired</tspan>
<tspan x="618" dy="14.3">wet adhesive gripper</tspan>
</text>
