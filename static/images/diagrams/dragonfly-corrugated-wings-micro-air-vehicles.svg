<path d="M 404 150 C 420 124, 468 128, 500 150 C 468 172, 420 176, 404 150 Z" fill="none" stroke="#2d6a4f" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><path d="M 390 116 C 430 133, 470 133, 510 116" fill="none" stroke="#2d6a4f" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" opacity="0.55"/><path d="M 390 184 C 430 167, 470 167, 510 184" fill="none" stroke="#2d6a4f" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" opacity="0.55"/>
