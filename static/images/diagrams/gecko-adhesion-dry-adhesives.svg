<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 340" role="img" width="100%" style="max-width:900px;height:auto;font-family:ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif;">
<style>
      .kicker { font-size:11px; font-weight:600; letter-spacing:.16em; fill:#8a8a8a; }
      .group  { font-size:11px; font-weight:600; letter-spacing:.14em; fill:#2d6a4f; }
      .step   { font-size:11px; font-weight:600; letter-spacing:.12em; }
      .step .num  { fill:#2d6a4f; }
      .step .word { fill:#8a8a8a; }
    </style>
<rect x="0.5" y="0.5" width="899" height="339" rx="16" fill="#ffffff" stroke="#e7e7e7"/>
<text x="40" y="44" class="kicker">BIOMIMICRY MECHANISM</text>
<circle cx="796" cy="40" r="3" fill="#2d6a4f"/>
<text x="860" y="44" class="group" text-anchor="end">ATTACH</text>
<line x1="40" y1="64" x2="860" y2="64" stroke="#e7e7e7"/>
<path d="M 285 207 L 295 214 L 285 221" fill="none" stroke="#8a8a8a" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" opacity="0.75"/>
<path d="M 565 207 L 575 214 L 565 221" fill="none" stroke="#8a8a8a" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" opacity="0.75"/>
<text x="58" y="120" class="step"><tspan class="num">01</tspan><tspan dx="8" class="word">ORGANISM</tspan></text>
<text x="58" y="148.5" text-anchor="start" style="font-size:16.5px;font-weight:700;fill:#1a1a1a;">
<tspan x="58" dy="0.0">Tokay gecko</tspan>
</text>
<text x="58" y="198.5" text-anchor="start" style="font-size:12.5px;font-weight:400;fill:#5b5b5b;">
<tspan x="58" dy="0.0">Millions of microscopic</tspan>
<tspan x="58" dy="16.2">hair-like structures called</tspan>
<tspan x="58" dy="16.2">setae on the gecko&#39;s toe</tspan>
<tspan x="58" dy="16.2">pads create van der Waals</tspan>
<tspan x="58" dy="16.2">forces</tspan>
</text>
<text x="338" y="120" class="step"><tspan class="num">02</tspan><tspan dx="8" class="word">MECHANISM</tspan></text>
<circle cx="430" cy="176" r="46" fill="#f6f8f6"/>
<line x1="392" y1="146" x2="468" y2="146" fill="none" stroke="#2d6a4f" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><line x1="406" y1="146" x2="406" y2="168" fill="none" stroke="#2d6a4f" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><line x1="406" y1="168" x2="396" y2="188" fill="none" stroke="#2d6a4f" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><line x1="392" y1="188" x2="400" y2="188" fill="none" stroke="#2d6a4f" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><line x1="406" y1="168" x2="416" y2="188" fill="none" stroke="#2d6a4f" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><line x1="412" y1="188" x2="420" y2="188" fill="none" stroke="#2d6a4f" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><line x1="430" y1="146" x2="430" y2="168" fill="none" stroke="#2d6a4f" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><line x1="430" y1="168" x2="420" y2="188" fill="none" stroke="#2d6a4f" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><line x1="416" y1="188" x2="424" y2="188" fill="none" stroke="#2d6a4f" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><line x1="430" y1="168" x2="440" y2="188" fill="none" stroke="#2d6a4f" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><line x1="436" y1="188" x2="444" y2="188" fill="none" stroke="#2d6a4f" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><line x1="454" y1="146" x2="454" y2="168" fill="none" stroke="#2d6a4f" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><line x1="454" y1="168" x2="444" y2="188" fill="none" stroke="#2d6a4f" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><line x1="440" y1="188" x2="448" y2="188" fill="none" stroke="#2d6a4f" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><line x1="454" y1="168" x2="464" y2="188" fill="none" stroke="#2d6a4f" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><line x1="460" y1="188" x2="468" y2="188" fill="none" stroke="#2d6a4f" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
<text x="338" y="240.0" text-anchor="start" style="font-size:12.0px;font-weight:400;fill:#5b5b5b;">
<tspan x="338" dy="0.0">Hierarchical micro- and</tspan>
<tspan x="338" dy="15.6">nano-scale fibrillar</tspan>
<tspan x="338" dy="15.6">structures create</tspan>
<tspan x="338" dy="15.6">intermolecular adhesion that</tspan>
<tspan x="338" dy="15.6">is strong in shear but</tspan>
<tspan x="338" dy="15.6">releases…</tspan>
</text>
<text x="618" y="120" class="step"><tspan class="num">03</tspan><tspan dx="8" class="word">APPLICATION</tspan></text>
<text x="618" y="145.0" text-anchor="start" style="font-size:13.0px;font-weight:600;fill:#1a1a1a;">
<tspan x="618" dy="0.0">Dry adhesive tapes and pads</tspan>
<tspan x="618" dy="16.9">that stick to almost any</tspan>
<tspan x="618" dy="16.9">surface without glue,</tspan>
<tspan x="618" dy="16.9">residue, or suction</tspan>
</text>
<text x="618" y="271.0" text-anchor="start" style="font-size:11.0px;font-weight:400;fill:#8a8a8a;">
<tspan x="618" dy="0.0">Real-world: Geckskin</tspan>
</text>
</svg>