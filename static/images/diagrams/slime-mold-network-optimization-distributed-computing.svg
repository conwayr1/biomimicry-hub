<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 340" role="img" width="100%" style="max-width:900px;height:auto;font-family:ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif;">
<style>
      .kicker { font-size:11px; font-weight:600; letter-spacing:.16em; fill:#8a8a8a; }
      .group  { font-size:11px; font-weight:600; letter-spacing:.14em; fill:#2d6a4f; }
      .step   { font-size:11px; font-weight:600; letter-spacing:.12em; }
      .step .num  { fill:#2d6a4f; }
      .step .word { fill:#8a8a8a; }
    </style>
<rect x="0.5" y="0.5" width="899" height="339" rx="16" fill="#ffffff" stroke="#e7e7e7"/>
<text x="40" y="44" class="kicker">BIOMIMICRY MECHANISM</text>
<circle cx="804" cy="40" r="3" fill="#2d6a4f"/>
<text x="860" y="44" class="group" text-anchor="end">SENSE</text>
<line x1="40" y1="64" x2="860" y2="64" stroke="#e7e7e7"/>
<path d="M 285 207 L 295 214 L 285 221" fill="none" stroke="#8a8a8a" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" opacity="0.75"/>
<path d="M 565 207 L 575 214 L 565 221" fill="none" stroke="#8a8a8a" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" opacity="0.75"/>
<text x="58" y="120" class="step"><tspan class="num">01</tspan><tspan dx="8" class="word">ORGANISM</tspan></text>
<text x="58" y="148.5" text-anchor="start" style="font-size:16.5px;font-weight:700;fill:#1a1a1a;">
<tspan x="58" dy="0.0">Physarum polycephalum</tspan>
<tspan x="58" dy="21.4">(slime mold)</tspan>
</text>
<text x="58" y="198.5" text-anchor="start" style="font-size:12.5px;font-weight:400;fill:#5b5b5b;">
<tspan x="58" dy="0.0">Without a brain or nervous</tspan>
<tspan x="58" dy="16.2">system, solves shortest-path</tspan>
<tspan x="58" dy="16.2">problems between food</tspan>
<tspan x="58" dy="16.2">sources by reinforcing</tspan>
<tspan x="58" dy="16.2">efficient…</tspan>
</text>
<text x="338" y="120" class="step"><tspan class="num">02</tspan><tspan dx="8" class="word">MECHANISM</tspan></text>
<circle cx="430" cy="176" r="46" fill="#f6f8f6"/>
<path d="M 418 196 A 15 15 0 0 1 442 196" fill="none" stroke="#2d6a4f" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" opacity="1.00"/><path d="M 408 196 A 28 28 0 0 1 452 196" fill="none" stroke="#2d6a4f" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" opacity="0.78"/><path d="M 398 196 A 41 41 0 0 1 462 196" fill="none" stroke="#2d6a4f" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" opacity="0.56"/><path d="M 388 196 A 54 54 0 0 1 472 196" fill="none" stroke="#2d6a4f" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" opacity="0.34"/><circle cx="430" cy="196" r="3" fill="#2d6a4f"/>
<text x="338" y="240.0" text-anchor="start" style="font-size:12.0px;font-weight:400;fill:#5b5b5b;">
<tspan x="338" dy="0.0">Positive feedback reinforces</tspan>
<tspan x="338" dy="15.6">high-throughput paths while</tspan>
<tspan x="338" dy="15.6">oscillatory flow in tubes</tspan>
<tspan x="338" dy="15.6">prunes low-efficiency routes</tspan>
</text>
<text x="618" y="120" class="step"><tspan class="num">03</tspan><tspan dx="8" class="word">APPLICATION</tspan></text>
<text x="618" y="145.0" text-anchor="start" style="font-size:13.0px;font-weight:600;fill:#1a1a1a;">
<tspan x="618" dy="0.0">Network design algorithms</tspan>
<tspan x="618" dy="16.9">for roads, rail, internet</tspan>
<tspan x="618" dy="16.9">routing, and supply chains</tspan>
</text>
<text x="618" y="269.5" text-anchor="start" style="font-size:9.5px;font-weight:400;fill:#8a8a8a;">
<tspan x="618" dy="0.0">Real-world: Toshiba</tspan>
<tspan x="618" dy="12.3">slime-mold-inspired network routing</tspan>
<tspan x="618" dy="12.3">chips; academic applications to</tspan>
<tspan x="618" dy="12.3">internet topology design</tspan>
</text>
</svg>