<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 320" role="img" width="100%" style="max-width:900px;height:auto;font-family:ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif;">
<style>
      .kicker { font-size:11px; font-weight:600; letter-spacing:.16em; fill:#8a8a8a; }
      .group  { font-size:11px; font-weight:600; letter-spacing:.14em; fill:#2d6a4f; }
      .step   { font-size:11px; font-weight:600; letter-spacing:.12em; }
      .step .num  { fill:#2d6a4f; }
      .step .word { fill:#8a8a8a; }
      .name   { font-size:17px; font-weight:700; fill:#1a1a1a; }
      .lead   { font-size:13.5px; font-weight:600; fill:#1a1a1a; }
      .body   { font-size:12.5px; font-weight:400; fill:#5b5b5b; }
      .cap    { font-size:11.5px; font-weight:400; fill:#8a8a8a; }
    </style>
<rect x="0.5" y="0.5" width="899" height="319" rx="16" fill="#ffffff" stroke="#e7e7e7"/>
<text x="40" y="44" class="kicker">BIOMIMICRY MECHANISM</text>
<circle cx="788" cy="40" r="3" fill="#2d6a4f"/>
<text x="860" y="44" class="group" text-anchor="end">PROCESS</text>
<line x1="40" y1="60" x2="860" y2="60" stroke="#e7e7e7"/>
<path d="M 295 143 L 305 150 L 295 157" fill="none" stroke="#8a8a8a" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" opacity="0.75"/>
<path d="M 585 143 L 595 150 L 585 157" fill="none" stroke="#8a8a8a" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" opacity="0.75"/>
<text x="58" y="90" class="step"><tspan class="num">01</tspan><tspan dx="8" class="word">ORGANISM</tspan></text>
<text x="58" y="124" class="name" text-anchor="start">
<tspan x="58" dy="0">Bactrian camel</tspan>
</text>
<text x="58" y="176" class="body" text-anchor="start">
<tspan x="58" dy="0">Tolerates 30% body water loss,</tspan>
<tspan x="58" dy="18">body temperature swings of 6°C</tspan>
<tspan x="58" dy="18">over a day, and fat stored in</tspan>
<tspan x="58" dy="18">humps (not water) that provides…</tspan>
</text>
<text x="348" y="90" class="step"><tspan class="num">02</tspan><tspan dx="8" class="word">MECHANISM</tspan></text>
<circle cx="450" cy="150" r="58" fill="#f6f8f6"/>
<path d="M 480 136 A 30 30 0 1 1 426 168" fill="none" stroke="#2d6a4f" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><path d="M 480 136 l 3 -13 l -12 4" fill="none" stroke="#2d6a4f" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><path d="M 420 164 A 30 30 0 1 1 474 132" fill="none" stroke="#2d6a4f" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><path d="M 420 164 l -3 13 l 12 -4" fill="none" stroke="#2d6a4f" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
<text x="348" y="240" class="body" text-anchor="start">
<tspan x="348" dy="0">Allowing body temperature to rise</tspan>
<tspan x="348" dy="17">during the day acts as a thermal</tspan>
<tspan x="348" dy="17">buffer — absorbing heat that would…</tspan>
</text>
<text x="612" y="90" class="step"><tspan class="num">03</tspan><tspan dx="8" class="word">APPLICATION</tspan></text>
<text x="612" y="124" class="lead" text-anchor="start">
<tspan x="612" dy="0">Passive building cooling</tspan>
<tspan x="612" dy="19">strategies that allow indoor</tspan>
<tspan x="612" dy="19">temperature to fluctuate within</tspan>
<tspan x="612" dy="19">a comfort range to reduce HVAC…</tspan>
</text>
<text x="612" y="214" class="cap" text-anchor="start">
<tspan x="612" dy="0">Real-world: Thermal mass building</tspan>
<tspan x="612" dy="16">design principles derived from</tspan>
<tspan x="612" dy="16">camel thermoregulation…</tspan>
</text>
</svg>